[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-single-decode"
version = "0.1.0"
description = "Small llama.cpp-backed Jev-compatible choice API adapter"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "siren2345" }]
keywords = ["jev", "choice", "llama.cpp", "local-inference", "http-api"]
dependencies = []

[project.urls]
Repository = "https://github.com/siren2345/jev-single-decode"
